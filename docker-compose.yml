# Local PostgreSQL for MoneyMap:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: moneymap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - moneymap-db:/var/lib/postgresql/data
volumes:
  moneymap-db:
